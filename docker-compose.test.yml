services:
  postgres-test:
    image: postgres:16-alpine
    container_name: libya-freelance-test-db
    environment:
      POSTGRES_USER: libya_freelance_test
      POSTGRES_PASSWORD: libya_freelance_test
      POSTGRES_DB: libya_freelance_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U libya_freelance_test -d libya_freelance_test']
      interval: 3s
      timeout: 5s
      retries: 12
