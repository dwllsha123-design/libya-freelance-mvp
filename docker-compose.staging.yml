# Staging reference compose — local or VPS staging only.
# NOT for production. Uses separate DB volume and secrets.
#
# Usage:
#   cp .env.staging.example .env.staging   # fill secrets
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
#
# Migrations (run once before/upgrading API):
#   docker compose -f docker-compose.staging.yml run --rm migrate

services:
  postgres-staging:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-libya_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-libya_freelance_staging}
    volumes:
      - staging_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./backend
      target: build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-libya_staging}:${POSTGRES_PASSWORD}@postgres-staging:5432/${POSTGRES_DB:-libya_freelance_staging}?schema=public
    depends_on:
      postgres-staging:
        condition: service_healthy
    command: >
      sh -c "node node_modules/prisma/build/index.js migrate deploy
      && node node_modules/prisma/build/index.js migrate status
      && npm run prisma:seed"
    profiles: ['tools']

  api-staging:
    build:
      context: ./backend
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-libya_staging}:${POSTGRES_PASSWORD}@postgres-staging:5432/${POSTGRES_DB:-libya_freelance_staging}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://staging.libyanfreelance.ly}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://staging.libyanfreelance.ly}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?set S3_PUBLIC_BASE_URL}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      PAYMENT_DRIVER: ${PAYMENT_DRIVER:-simulated}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-LYD}
      PAYMENT_SIMULATED_FAILURE: ${PAYMENT_SIMULATED_FAILURE:-false}
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres-staging:
        condition: service_healthy

  web-staging:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api-staging.libyanfreelance.ly/api}
    environment:
      NODE_ENV: production
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api-staging

volumes:
  staging_pg_data:
