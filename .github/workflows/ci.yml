name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: libya_freelance_test
          POSTGRES_PASSWORD: libya_freelance_test
          POSTGRES_DB: libya_freelance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libya_freelance_test -d libya_freelance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://libya_freelance_test:libya_freelance_test@localhost:5432/libya_freelance_test?schema=public
      REQUIRE_E2E: '1'
      NODE_ENV: test
      PORT: 4000
      JWT_ACCESS_SECRET: ci-access-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-characters-long
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Migrate deploy (fresh DB)
        run: npx prisma migrate deploy

      - name: Migrate status
        run: npx prisma migrate status

      - name: Reference seed
        run: npm run prisma:seed

      - name: Reference seed idempotency
        run: npm run prisma:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: E2E tests (run 1)
        run: npm run test:e2e

      - name: E2E tests (run 2)
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Verify production deploy boundary
        run: npm run verify:prod-boundary

      - name: Package production runtime bundle
        run: npm run package:runtime

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high || true
        continue-on-error: true

  backend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high || true
        continue-on-error: true
