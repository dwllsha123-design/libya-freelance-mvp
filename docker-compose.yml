services:
  postgres:
    image: postgres:16-alpine
    container_name: libya-freelance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: libya_freelance
      POSTGRES_PASSWORD: libya_freelance_dev
      POSTGRES_DB: libya_freelance
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U libya_freelance -d libya_freelance']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
